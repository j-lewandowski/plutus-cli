name: Release

on:
  push:
    tags:
      - "v*"
  workflow_run:
    workflows: ["Bump Version"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (e.g. v3.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch)
              VERSION="${{ inputs.tag }}"
              ;;
            push)
              VERSION="${GITHUB_REF#refs/tags/}"
              ;;
            workflow_run)
              git fetch --tags --force
              VERSION=$(git describe --tags --abbrev=0)
              ;;
          esac

          if ! git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION not found"
            exit 1
          fi

          git checkout "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          mkdir dist

          VERSION=${{ steps.version.outputs.version }}
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          LDFLAGS="-X main.Version=${VERSION} -X main.Commit=${COMMIT} -X main.BuildTime=${BUILD_TIME} -s -w"

          # Linux
          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/plutus-cli-linux-amd64 ./cmd/plutus
          GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/plutus-cli-linux-arm64 ./cmd/plutus

          # macOS
          GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/plutus-cli-mac-amd64 ./cmd/plutus
          GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/plutus-cli-mac-arm64 ./cmd/plutus

          # Windows
          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/plutus-cli-windows-amd64.exe ./cmd/plutus
          GOOS=windows GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/plutus-cli-windows-arm64.exe ./cmd/plutus

      - name: Create checksums
        run: |
          sha256sum dist/* > dist/checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: |
            dist/*
